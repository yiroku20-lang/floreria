    <!-- Polyfill guard for window.fetch in sandboxed iframe environments -->
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          var customFetch = null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || (typeof nativeFetch === 'function' ? nativeFetch.bind(window) : nativeFetch);
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if property is non-configurable
        }
      })();
    </script>
